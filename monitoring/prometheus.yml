global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'kleinanzeigen-crawler'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - "alerts.yml"

# Scrape configurations
scrape_configs:
  - job_name: 'kleinanzeigen-crawler'
    static_configs:
      - targets: ['bot:9090']
        labels:
          service: 'crawler'
