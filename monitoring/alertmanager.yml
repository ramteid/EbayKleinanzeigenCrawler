global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'crawler-alerts'

receivers:
  - name: 'crawler-alerts'
    # Configure this webhook URL to point at your preferred alert sink
    webhook_configs:
      - url: 'http://alert-webhook:8080/alerts'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']
